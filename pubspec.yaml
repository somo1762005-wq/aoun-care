name: aoun_new
description: "Aoun Care - healthcare companion app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.0
  uuid: ^4.3.3
  intl: ^0.19.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  geolocator: ^13.0.1
  url_launcher: ^6.3.2
  share_plus: ^10.1.0
  permission_handler: ^11.3.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/icon/icon.png
  fonts:
    - family: ModernNo20
      fonts:
        - asset: assets/fonts/ModernNo20.ttf
    - family: AppleEmoji
      fonts:
        - asset: assets/fonts/apple_color_emoji.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
